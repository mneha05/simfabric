[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="simfabric"
version="0.2.0"
description="SystemC/TLM accelerator performance modeling and design-space exploration"
requires-python=">=3.11"
dependencies=[]

[project.scripts]
simfabric="simfabric.cli:main"

[tool.setuptools.packages.find]
include=["simfabric*"]

[tool.pytest.ini_options]
testpaths=["tests"]
